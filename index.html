<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoops Board</title>
<meta name="description" content="Live men's college basketball scores: every Power 4, Big East and Top 25 game, with UVA first.">
<meta name="theme-color" content="#1d3557">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Graduate&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<header class="masthead">
  <div class="wrap masthead-inner">
    <div class="brand-row">
      <div class="brand">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2v20M5 5c3 3 3 11 0 14M19 5c-3 3-3 11 0 14"/></svg>
        <span>Hoops Board</span>
      </div>
      <div class="brand-tools">
        <span id="updated" class="updated"></span>
        <button type="button" id="theme" class="icon-btn" aria-label="Switch light or dark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </div>
    <div class="date-row">
      <svg class="center-court" width="440" height="120" viewBox="0 0 440 120" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="220" cy="0" r="100"/><circle cx="220" cy="0" r="34"/><path d="M0 1H440"/></svg>
      <button type="button" id="prev" class="day-btn" aria-label="Previous day">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="date-text">
        <div id="day-tag" class="day-tag"></div>
        <h1 id="day"></h1>
        <a href="./" id="today-link" class="today-link" hidden>Back to today</a>
      </div>
      <button type="button" id="next" class="day-btn" aria-label="Next day">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
  </div>
  <div class="floorboards" aria-hidden="true"></div>
</header>

<nav class="filters-bar" aria-label="Filter games">
  <div class="wrap"><div id="filters" class="filters"></div></div>
</nav>

<main class="wrap main">
  <p id="error" class="error" role="status" hidden></p>
  <div id="uva"></div>
  <div id="games"></div>
</main>

<footer class="wrap footer">
  <span id="updated-foot" class="updated-foot"></span> Scores from ESPN · updates every 30 seconds while games are live · tap a game for ESPN's box score
</footer>
</body>
</html>
